<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zepto Delivery Partner</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --z-bg: #0b0214;
      --z-card: #19052b;
      --z-card-inner: #24083d;
      --z-pink: #ff3269;
      --z-purple: #8b14d9;
      --z-yellow: #ffc727;
      --z-green: #00d26a;
      --z-text: #ffffff;
      --z-muted: #9e8fb2;
      --z-border: #320d53;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--z-bg);
      color: var(--z-text);
      padding-bottom: 90px;
    }

    /* Zepto Partner Header */
    header {
      background: #150226;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--z-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(90deg, #ff3269, #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .rider-badge {
      background: #24083d;
      border: 1px solid var(--z-purple);
      color: #38bdf8;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .duty-toggle {
      background: rgba(0, 210, 106, 0.15);
      border: 1px solid var(--z-green);
      color: var(--z-green);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .duty-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--z-green);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Tabs Filter */
    .tabs-bar {
      display: flex;
      background: #150226;
      border-bottom: 1px solid var(--z-border);
      padding: 0 16px;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--z-muted);
      cursor: pointer;
      position: relative;
    }
    .tab-item.active {
      color: #fff;
    }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: var(--z-pink);
      border-radius: 3px 3px 0 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    /* Order Card UI */
    .order-card {
      background: var(--z-card);
      border: 1px solid var(--z-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .order-card.new-alert {
      border-color: var(--z-pink);
      animation: flashBorder 1s infinite alternate;
    }
    @keyframes flashBorder {
      from { box-shadow: 0 0 4px rgba(255, 50, 105, 0.2); }
      to { box-shadow: 0 0 16px rgba(255, 50, 105, 0.7); }
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--z-border);
      padding-bottom: 10px;
    }
    .order-id-txt {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-placed { background: rgba(255, 199, 39, 0.15); color: var(--z-yellow); border: 1px solid var(--z-yellow); }
    .badge-picked { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
    .badge-delivered { background: rgba(0, 210, 106, 0.15); color: var(--z-green); border: 1px solid var(--z-green); }

    /* Customer Info Box */
    .info-card {
      background: var(--z-card-inner);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .cust-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .cust-loc {
      font-size: 13px;
      color: var(--z-muted);
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    /* Items Preview */
    .items-container {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      color: #d1d5db;
      margin-bottom: 4px;
    }
    .cod-bill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--z-border);
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    /* Action Buttons Flow */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-call {
      background: #1e293b;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #334155;
    }
    .btn-maps {
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Main Zepto Step Buttons */
    .btn-stage {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-accept {
      background: linear-gradient(90deg, #ff3269, #e01d51);
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 50, 105, 0.4);
    }
    .btn-deliver {
      background: linear-gradient(90deg, #00d26a, #0c831f);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 210, 106, 0.4);
    }

    /* Maps Preview Box */
    .map-preview {
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      height: 140px;
      border: 1px solid var(--z-border);
    }
    .map-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Audio Enable Bar (Required by Browsers) */
    .audio-notice {
      background: rgba(255, 199, 39, 0.1);
      border: 1px dashed var(--z-yellow);
      color: var(--z-yellow);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Zepto Partner Top Bar -->
  <header>
    <div class="brand-wrap">
      <div class="brand-title">zepto</div>
      <div class="rider-badge">Rider</div>
    </div>
    <div class="duty-toggle">
      <div class="duty-dot"></div>
      <span>ONLINE</span>
    </div>
  </header>

  <!-- Filter Tabs -->
  <div class="tabs-bar">
    <div class="tab-item active" id="tab-active" onclick="switchTab('active')">Active Orders (<span id="count-active">0</span>)</div>
    <div class="tab-item" id="tab-delivered" onclick="switchTab('delivered')">Delivered (<span id="count-delivered">0</span>)</div>
  </div>

  <div class="container">
    <!-- Browser Audio Permission Notice -->
    <div class="audio-notice" id="sound-enabler" onclick="enableAudioEngine()">
      <span>🔔 <b>Sound Siren:</b> Tap to enable Order Ringtone</span>
      <span style="font-size: 14px;">🔊</span>
    </div>

    <div id="loader" style="text-align:center; padding: 40px; font-size: 13px; color: var(--z-muted);">
      Connecting to Zepto Dark Store...
    </div>

    <div id="orders-list"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mpeikimhkjuinqkjaumr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2_wD-pbi_pNf8niiHxFbYA_saCIhApN';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let ordersCache = [];
    let currentTab = 'active';
    let knownOrderIds = new Set();
    let isAudioAllowed = false;
    let audioContext = null;
    let alertInterval = null;

    // Web Audio Siren Synthesizer (No external mp3 link needed)
    function playZeptoSiren() {
      if (!isAudioAllowed) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.log('Audio alert err:', e);
      }
    }

    function startSirenLoop() {
      if (alertInterval) return;
      playZeptoSiren();
      alertInterval = setInterval(() => {
        playZeptoSiren();
      }, 700);
    }

    function stopSirenLoop() {
      if (alertInterval) {
        clearInterval(alertInterval);
        alertInterval = null;
      }
    }

    function enableAudioEngine() {
      isAudioAllowed = true;
      document.getElementById('sound-enabler').style.display = 'none';
      playZeptoSiren(); // टेस्ट साउंड
    }

    // Initialize App
    async function initRiderApp() {
      await fetchAllOrders();
      setInterval(fetchAllOrders, 4000); // 4 सेकंड में रियल-टाइम चेक
    }

    async function fetchAllOrders() {
      try {
        const { data, error } = await _supabase
          .from('orders')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        document.getElementById('loader').style.display = 'none';
        ordersCache = data || [];

        // Check for new incoming orders
        const hasNewOrder = ordersCache.some(o => o.status === 'Order Placed');
        if (hasNewOrder) {
          startSirenLoop();
        } else {
          stopSirenLoop();
        }

        renderUI();
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-active').className = tab === 'active' ? 'tab-item active' : 'tab-item';
      document.getElementById('tab-delivered').className = tab === 'delivered' ? 'tab-item active' : 'tab-item';
      renderUI();
    }

    function renderUI() {
      const container = document.getElementById('orders-list');
      const activeOrders = ordersCache.filter(o => o.status !== 'Delivered');
      const deliveredOrders = ordersCache.filter(o => o.status === 'Delivered');

      document.getElementById('count-active').innerText = activeOrders.length;
      document.getElementById('count-delivered').innerText = deliveredOrders.length;

      const targetList = currentTab === 'active' ? activeOrders : deliveredOrders;

      if (targetList.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 0; color: var(--z-muted); font-size: 13px;">
            ${currentTab === 'active' ? 'No active orders right now. Waiting for customers...' : 'No delivered orders in this shift.'}
          </div>
        `;
        return;
      }

      container.innerHTML = targetList.map(order => {
        const isNew = order.status === 'Order Placed';
        const isPicked = order.status === 'Out for Delivery' || order.status === 'Picked Up';
        const isDone = order.status === 'Delivered';

        const itemsHTML = Array.isArray(order.items)
          ? order.items.map(i => `<div class="item-row"><span>${i.name} × ${i.qty}</span><span>₹${i.subtotal}</span></div>`).join('')
          : 'Items details missing';

        let badgeClass = 'badge-placed';
        let badgeTxt = 'READY FOR PICKUP';
        if (isPicked) { badgeClass = 'badge-picked'; badgeTxt = 'ON THE WAY'; }
        if (isDone) { badgeClass = 'badge-delivered'; badgeTxt = 'DELIVERED'; }

        return `
          <div class="order-card ${isNew ? 'new-alert' : ''}">
            <div class="order-header">
              <div class="order-id-txt">#ORD-${order.id}</div>
              <div class="status-badge ${badgeClass}">${badgeTxt}</div>
            </div>

            <!-- Customer Details -->
            <div class="info-card">
              <div class="cust-name">
                <span>👤</span> ${order.customer_name}
              </div>
              <div class="cust-loc">
                <span>📍</span> <span>${order.delivery_address}</span>
              </div>
            </div>

            <!-- Items Box -->
            <div class="items-container">
              <div style="font-weight: 700; color: var(--z-muted); margin-bottom: 6px;">ITEMS IN BAG:</div>
              ${itemsHTML}
              <div class="cod-bill">
                <span>Collect Cash (COD):</span>
                <span style="color: var(--z-green);">₹${order.total_amount}</span>
              </div>
            </div>

            <!-- Map View (Only when Picked Up) -->
            ${isPicked ? `
              <div class="map-preview">
                <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(order.delivery_address)}&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>
              </div>
            ` : ''}

            <!-- Communication Action Buttons -->
            <div class="action-grid">
              <a class="btn-call" href="tel:${order.customer_phone}">📞 Call</a>
              <a class="btn-maps" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.delivery_address)}">🗺️ Open Map</a>
            </div>

            <!-- Zepto Flow Buttons -->
            ${isNew ? `
              <button class="btn-stage btn-accept" onclick="updateStatus(${order.id}, 'Out for Delivery')">
                ⚡ Accept & Pick Up Order
              </button>
            ` : ''}

            ${isPicked ? `
              <button class="btn-stage btn-deliver" onclick="updateStatus(${order.id}, 'Delivered')">
                ✓ Mark as Delivered
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function updateStatus(orderId, nextStatus) {
      stopSirenLoop();
      try {
        const { error } = await _supabase
          .from('orders')
          .update({ status: nextStatus })
          .eq('id', orderId);

        if (error) throw error;
        await fetchAllOrders();
      } catch (e) {
        alert('Status update failed: ' + e.message);
      }
    }

    initRiderApp();
  </script>
</body>
</html>
