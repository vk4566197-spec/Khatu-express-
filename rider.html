<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 Baba Food Rider Partner</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #121927;
      --card-dark: #1e2837;
      --card-white: #ffffff;
      --accent-green: #10b981;
      --accent-pink: #e11d48;
      --zepto-pink: #ff3269;
      --text-white: #ffffff;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding-bottom: 90px; }

    /* AUTH SCREEN */
    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0f19; z-index: 1000; display: none;
      align-items: center; justify-content: center; padding: 20px;
    }
    .auth-overlay.active { display: flex; }
    .auth-box {
      background: #1e2837; width: 100%; max-width: 380px; border-radius: 20px;
      padding: 26px 20px; border: 1px solid #334155; text-align: center;
    }
    .auth-input {
      background: #0f172a; border: 1.5px solid #334155; color: #fff; padding: 12px 14px;
      border-radius: 10px; font-size: 13px; font-weight: 600; outline: none; width: 100%; margin-bottom: 10px;
    }
    .btn-auth-submit {
      background: linear-gradient(90deg, #ff3269, #e11d48); color: white; border: none;
      padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 900; cursor: pointer; width: 100%;
    }

    /* Top Partner Header */
    .top-bar {
      background: #ffffff; color: #1e293b; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .store-info { display: flex; align-items: center; gap: 10px; }
    .store-name { font-size: 13px; font-weight: 800; }
    .store-id { font-size: 10px; color: #64748b; font-weight: 600; }

    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Orders Queue */
    .orders-queue-box { margin: 16px; }
    .rider-order-card {
      background: var(--card-dark); border: 1px solid #334155; border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
    }
    .r-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .r-badge { background: #0284c7; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .r-address { font-size: 12px; color: #cbd5e1; margin: 8px 0; line-height: 1.4; }
    .btn-action-rider {
      background: var(--accent-green); color: white; border: none; width: 100%;
      padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; margin-top: 8px;
    }

    /* Live Route Screen */
    .way-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f1f5f9; z-index: 700; display: none; flex-direction: column; }
    .way-screen.active { display: flex; }
    .way-map-container { position: relative; width: 100%; height: 55%; background: #e2e8f0; }
    .way-map-iframe { width: 100%; height: 100%; border: none; }
    .way-bottom-sheet { flex: 1; background: #ffffff; border-radius: 24px 24px 0 0; padding: 16px 20px; display: flex; flex-direction: column; justify-content: space-between; color: #0f172a; }

    /* ======================================= */
    /* RIDER IN-APP CHAT DRAWER                */
    /* ======================================= */
    .chat-drawer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; z-index: 950; display: none; flex-direction: column;
    }
    .chat-drawer.active { display: flex; }
    .chat-top-header {
      background: #1e293b; color: white; padding: 16px;
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .chat-messages-area {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .msg-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4;
      word-wrap: break-word; font-weight: 600;
    }
    .msg-rider-send {
      align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px;
    }
    .msg-cust-receive {
      align-self: flex-start; background: #1e293b; color: white; border: 1px solid #334155; border-bottom-left-radius: 2px;
    }

    .quick-chips-row {
      display: flex; gap: 8px; padding: 8px 14px; overflow-x: auto;
      scrollbar-width: none; background: #1e2837; border-top: 1px solid #334155;
    }
    .quick-chips-row::-webkit-scrollbar { display: none; }
    .quick-chip {
      background: #334155; color: #e2e8f0; padding: 6px 12px; border-radius: 16px;
      font-size: 11px; font-weight: 800; white-space: nowrap; cursor: pointer;
    }

    .chat-input-bar {
      padding: 10px 14px; background: #1e2837; border-top: 1px solid #334155;
      display: flex; gap: 8px; align-items: center;
    }
    .chat-input-box {
      flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #475569;
      background: #0f172a; color: white; font-size: 13px; outline: none;
    }
    .chat-send-btn {
      background: var(--accent-green); color: white; border: none; width: 40px; height: 40px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-box">
      <div style="font-size: 18px; font-weight: 900; margin-bottom: 12px;">👑 Rider Partner Login</div>
      <input type="tel" id="login-phone" class="auth-input" placeholder="Enter Registered Phone No." maxlength="10">
      <button class="btn-auth-submit" onclick="handleRiderLogin()">Login</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="rider-main-app">
    <div class="top-bar">
      <div class="store-info">
        <div style="font-size:20px;">👑</div>
        <div>
          <div class="store-name" id="top-rider-name">Rider Partner</div>
          <div class="store-id" id="top-rider-id">BABA18</div>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="duty-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Active Orders Area -->
    <div class="orders-queue-box" id="rider-orders-list">
      <div style="text-align:center; color: var(--text-sub); padding: 30px;">लोड हो रहा है...</div>
    </div>
  </div>

  <!-- LIVE ROUTE SCREEN -->
  <div class="way-screen" id="way-screen">
    <div class="way-map-container">
      <iframe class="way-map-iframe" id="way-map-frame" src=""></iframe>
    </div>
    <div class="way-bottom-sheet">
      <div>
        <div style="font-size:18px; font-weight:900; margin-bottom:4px;">On the Way 🛵</div>
        <div style="font-size:12px; color:#475569;" id="way-customer-address">Customer Address</div>
      </div>

      <!-- Live Chat with Customer Button -->
      <button onclick="openRiderChat(currentSelectedOrder.id)" style="background:#0284c7; color:white; border:none; padding:12px; border-radius:10px; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
        💬 Chat with Customer
      </button>

      <button class="btn-action-rider" onclick="markDelivered()">
        ✅ Confirm Delivery
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- RIDER CHAT MODAL                           -->
  <!-- ========================================== -->
  <div class="chat-drawer" id="rider-chat-drawer">
    <div class="chat-top-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <button onclick="closeRiderChat()" style="background:none; border:none; color:white; font-size:20px; font-weight:900; cursor:pointer;">←</button>
        <div>
          <div style="font-size:15px; font-weight:900;" id="rchat-title">Chat with Customer</div>
          <div style="font-size:11px; color:var(--accent-green);">Live Order Chat</div>
        </div>
      </div>
      <div style="font-size: 18px;">👤</div>
    </div>

    <!-- Message List -->
    <div class="chat-messages-area" id="rider-chat-messages"></div>

    <!-- Rider Quick Reply Chips -->
    <div class="quick-chips-row">
      <div class="quick-chip" onclick="sendRiderQuickMsg('रास्ते में हूँ, 5 मिनट में पहुँचूँगा (On the way, 5 mins)')">🛵 On the way (5 mins)</div>
      <div class="quick-chip" onclick="sendRiderQuickMsg('मेन गेट पर आ जाइए (Please come to main gate)')">🚪 Come to main gate</div>
      <div class="quick-chip" onclick="sendRiderQuickMsg('मैंने डोरबेल बजा दी है (Rung the doorbell)')">🔔 Rung doorbell</div>
      <div class="quick-chip" onclick="sendRiderQuickMsg('कृपया कैश तैयार रखें (Please keep cash ready)')">💵 Keep cash ready</div>
    </div>

    <!-- Send Input -->
    <div class="chat-input-bar">
      <input type="text" id="rider-chat-text" class="chat-input-box" placeholder="Type reply to customer...">
      <button class="chat-send-btn" onclick="sendRiderCustomMsg()">➔</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mpeikimhkjuinqkjaumr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2_wD-pbi_pNf8niiHxFbYA_saCIhApN';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let loggedInRider = JSON.parse(localStorage.getItem('baba_logged_rider') || 'null');
    let currentSelectedOrder = null;
    let activeChatOrderId = null;
    let rChatInterval = null;

    function checkAuth() {
      if (!loggedInRider) {
        document.getElementById('auth-overlay').classList.add('active');
      } else {
        document.getElementById('auth-overlay').classList.remove('active');
        document.getElementById('top-rider-name').innerText = loggedInRider.name;
        document.getElementById('top-rider-id').innerText = `RIDER-${loggedInRider.id}`;
        loadOrders();
      }
    }

    async function handleRiderLogin() {
      const phone = document.getElementById('login-phone').value.trim();
      const { data } = await _supabase.from('riders').select('*').eq('phone', phone).single();
      if (data && data.status === 'Active') {
        loggedInRider = data;
        localStorage.setItem('baba_logged_rider', JSON.stringify(data));
        checkAuth();
      } else {
        alert('लॉगिन नहीं हो सका! या तो नंबर गलत है या एडमिन ने अभी अप्रूव नहीं किया।');
      }
    }

    async function loadOrders() {
      const { data } = await _supabase
        .from('orders')
        .select('*')
        .neq('status', 'Delivered')
        .order('id', { ascending: false });

      const container = document.getElementById('rider-orders-list');
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-sub); padding: 30px;">कोई नया ऑर्डर नहीं है।</div>';
        return;
      }

      container.innerHTML = data.map(o => `
        <div class="rider-order-card">
          <div class="r-card-head">
            <span style="font-weight:900;">ORD #${o.id}</span>
            <span class="r-badge">${o.status}</span>
          </div>
          <div style="font-size:13px; font-weight:700;">👤 ${o.customer_name} (📞 ${o.customer_phone})</div>
          <div class="r-address">📍 ${o.delivery_address}</div>
          <div style="font-size:13px; font-weight:800; color:var(--accent-green); margin:6px 0;">To Collect: ₹${o.total_amount} (${o.payment_mode})</div>

          <div style="display:flex; gap:8px; margin-top:8px;">
            <button onclick='openRiderChat(${o.id})' style="flex:1; background:#0284c7; color:white; border:none; padding:10px; border-radius:8px; font-weight:800; font-size:12px; cursor:pointer;">
              💬 Chat
            </button>
            <button onclick='startDelivery(${JSON.stringify(o)})' style="flex:2; background:var(--accent-green); color:white; border:none; padding:10px; border-radius:8px; font-weight:800; font-size:12px; cursor:pointer;">
              🛵 Start Delivery
            </button>
          </div>
        </div>
      `).join('');
    }

    function startDelivery(order) {
      currentSelectedOrder = order;
      document.getElementById('way-customer-address').innerText = order.delivery_address;
      document.getElementById('way-map-frame').src = `https://maps.google.com/maps?q=${encodeURIComponent(order.delivery_address)}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
      document.getElementById('way-screen').classList.add('active');
    }

    async function markDelivered() {
      if (!confirm('क्या ऑर्डर डिलीवर हो गया है?')) return;
      await _supabase.from('orders').update({ status: 'Delivered' }).eq('id', currentSelectedOrder.id);
      document.getElementById('way-screen').classList.remove('active');
      loadOrders();
    }

    // =====================================
    // RIDER CHAT LOGIC
    // =====================================
    function openRiderChat(orderId) {
      activeChatOrderId = orderId;
      document.getElementById('rchat-title').innerText = `Order #${orderId} Chat`;
      document.getElementById('rider-chat-drawer').classList.add('active');
      loadRiderMessages();
      if (!rChatInterval) rChatInterval = setInterval(loadRiderMessages, 2500);
    }

    function closeRiderChat() {
      document.getElementById('rider-chat-drawer').classList.remove('active');
      if (rChatInterval) { clearInterval(rChatInterval); rChatInterval = null; }
    }

    async function loadRiderMessages() {
      if (!activeChatOrderId) return;
      const { data } = await _supabase
        .from('order_chats')
        .select('*')
        .eq('order_id', activeChatOrderId)
        .order('id', { ascending: true });

      const container = document.getElementById('rider-chat-messages');
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="text-align:center; font-size:11px; color:#94a3b8; margin:10px 0;">कोई संदेश नहीं है। नीचे से रिप्लाई भेजें।</div>';
        return;
      }

      container.innerHTML = data.map(m => `
        <div class="msg-bubble ${m.sender === 'rider' ? 'msg-rider-send' : 'msg-cust-receive'}">
          <div style="font-size:10px; opacity:0.8; margin-bottom:2px;">${m.sender === 'rider' ? 'You' : '👤 Customer'}</div>
          ${m.message}
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function sendRiderMsg(txt) {
      if (!txt || !activeChatOrderId) return;
      await _supabase.from('order_chats').insert([{
        order_id: activeChatOrderId,
        sender: 'rider',
        message: txt
      }]);
      loadRiderMessages();
    }

    function sendRiderQuickMsg(t) { sendRiderMsg(t); }

    function sendRiderCustomMsg() {
      const inp = document.getElementById('rider-chat-text');
      const val = inp.value.trim();
      if (val) {
        sendRiderMsg(val);
        inp.value = '';
      }
    }

    checkAuth();
    setInterval(loadOrders, 5000);
  </script>
</body>
</html>
