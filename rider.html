<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ SM RIDER — Delivery Partner Portal</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest-rider.json">
  <meta name="theme-color" content="#120224">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' });
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-super: #1a1b3a;
      --primary-purple: #3c006b;
      --accent-cyan: #00f5d4;
      --accent-pink: #ff007f;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

    .rider-top-nav {
      background: #18052e;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #3c006b;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .rider-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rider-logo-img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: contain;
      border: 1.5px solid var(--accent-pink);
      background: #fff;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #ff007f, #ffbe0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-install-header {
      background: linear-gradient(135deg, #ff007f, #ff5400);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: none;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .profile-banner {
      background: #172033;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .duty-toggle-btn {
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .duty-toggle-btn.offline {
      background: var(--accent-red);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-cyan);
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tabs-nav {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px 16px;
    }
    .tab-pill {
      flex: 1;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }
    .tab-pill.active {
      background: var(--primary-purple);
      border-color: #a855f7;
      color: #ffffff;
    }

    .content-area {
      padding: 0 16px;
    }

    .order-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .order-card.super-order {
      background: var(--card-super);
      border-color: #6366f1;
    }

    .order-badge {
      font-size: 9.5px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-express { background: #059669; color: white; }
    .badge-24hr { background: #4f46e5; color: white; }

    .detail-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: #cbd5e1;
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn-rider-action {
      background: var(--primary-purple);
      color: white;
      border: 1px solid #a855f7;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-success { background: #059669; border: none; }
    .btn-danger { background: #dc2626; border: none; }
    .btn-map { background: #0284c7; border: none; }

    /* LOGIN MODAL WITH LOGIN TYPE */
    .login-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-dark);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--card-bg);
      border: 2px solid var(--primary-purple);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .input-rider {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      margin-bottom: 12px;
    }
    .input-rider:focus {
      border-color: var(--accent-pink);
    }

    .modal-box {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box.active { display: flex; }
    .modal-inner {
      background: var(--card-bg);
      border: 2px solid #a855f7;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN (WITH LOGIN TYPE DROPDOWN) -->
  <div class="login-container" id="rider-login-screen">
    <div class="login-card">
      <img src="logo.png" style="width:70px; height:70px; border-radius:18px; object-fit:contain; border:2px solid var(--accent-pink); margin-bottom:12px;" onerror="this.style.display='none'">
      <h2 style="font-size:18px; font-weight:900; margin-bottom:2px;">SM RIDER LOGIN</h2>
      <p style="font-size:11.5px; color:var(--text-muted); margin-bottom:16px;">Delivery Partner Portal</p>

      <!-- 👑 LOGIN ROLE/TYPE SELECTION -->
      <select id="login-rider-type" class="input-rider" style="border-color:#a855f7; font-weight:800; color:#38bdf8;">
        <option value="EXPRESS">⚡ Normal Express Rider (10-20 Min)</option>
        <option value="SUPER">👑 Super Rider (24 Hours Dedicated)</option>
      </select>
      
      <input type="tel" id="login-phone" class="input-rider" placeholder="Mobile Number (10 Digit)" maxlength="10">
      <input type="password" id="login-password" class="input-rider" placeholder="Password (Default: 1234)">
      
      <button class="btn-rider-action btn-success" style="width:100%; padding:13px;" onclick="riderLogin()">
        🚀 Login & Duty Shuru Karein
      </button>
    </div>
  </div>

  <!-- MAIN RIDER APP HEADER -->
  <div class="rider-top-nav">
    <div class="rider-brand">
      <img src="logo.png" class="rider-logo-img" alt="Logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title" id="nav-rider-name">SM RIDER 🛵</div>
        <div class="brand-sub" id="nav-rider-phone">----</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-install-app" class="btn-install-header" onclick="triggerPWAInstall()">📲 Install</button>
      <button class="btn-logout" onclick="riderLogout()">🚪 Logout</button>
    </div>
  </div>

  <div class="profile-banner">
    <div>
      <div style="font-size:10px; color:var(--text-muted); font-weight:800; text-transform:uppercase;">Current Role:</div>
      <div style="font-size:12.5px; font-weight:900; color:var(--accent-cyan);" id="profile-role-badge">⚡ Normal Express Rider</div>
    </div>
    <button id="duty-btn" class="duty-toggle-btn" onclick="toggleDuty()">🟢 ONLINE</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-active-count">0</div>
      <div class="stat-label">Active Orders</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-delivered-count">0</div>
      <div class="stat-label">Delivered</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-earnings">₹0</div>
      <div class="stat-label">Today Earned</div>
    </div>
  </div>

  <div class="tabs-nav">
    <button class="tab-pill active" id="tab-btn-active" onclick="switchRiderTab('active')">⚡ Active Orders</button>
    <button class="tab-pill" id="tab-btn-history" onclick="switchRiderTab('history')">📜 Completed / Past</button>
  </div>

  <div class="content-area">
    <div id="section-active-orders">
      <div id="rider-orders-list"><div style="text-align:center; padding:30px; color:var(--text-muted);">Orders load ho rahe hain...</div></div>
    </div>
    <div id="section-history-orders" style="display:none;">
      <div id="rider-history-list"></div>
    </div>
  </div>

  <!-- COMPLETE DELIVERY MODAL (OTP & PHOTO PROOF) -->
  <div class="modal-box" id="complete-modal">
    <div class="modal-inner">
      <h3 style="font-size:16px; font-weight:900; margin-bottom:8px; color:var(--accent-cyan);">🏁 Order Delivery Complete Karein</h3>
      <p style="font-size:11.5px; color:var(--text-muted); margin-bottom:12px;">Customer ka secret OTP darj karein aur delivery photo kheinchein:</p>

      <input type="tel" id="verify-otp-input" class="input-rider" placeholder="Customer 4-Digit OTP *" maxlength="4" style="text-align:center; font-size:18px; font-weight:900; letter-spacing:4px;">
      
      <div id="proof-photo-preview" style="width:100%; height:120px; background:#0f172a; border:1.5px dashed var(--border-color); border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; overflow:hidden;">
        <span style="font-size:11px; color:var(--text-muted);">📸 Delivery Proof Photo</span>
      </div>
      <input type="file" id="delivery-photo-input" accept="image/*" capture="environment" style="display:none;" onchange="handleDeliveryPhotoCaptured(this)">
      <button type="button" class="btn-rider-action btn-map" style="width:100%; margin-bottom:14px;" onclick="document.getElementById('delivery-photo-input').click()">
        📸 Proof Photo Kheinchein *
      </button>

      <div style="display:flex; gap:8px;">
        <button class="btn-rider-action btn-success" style="flex:1;" onclick="submitOrderDelivered()">✓ Confirm Delivery</button>
        <button class="btn-rider-action btn-danger" style="flex:1;" onclick="closeCompleteModal()">✕ Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mpeikimhkjuinqkjaumr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2_wD-pbi_pNf8niiHxFbYA_saCIhApN';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentRider = null;
    let allRiderOrders = [];
    let activeCompleteOrderId = null;
    let base64DeliveryProof = null;
    let liveGpsWatchId = null;
    let deferredPrompt = null;

    // PWA INSTALL PROMPT HANDLER
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('btn-install-app');
      if (installBtn) installBtn.style.display = 'block';
    });

    function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('btn-install-app').style.display = 'none';
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedRider = localStorage.getItem('sm_rider_data');
      if (savedRider) {
        currentRider = JSON.parse(savedRider);
        showDashboard();
      } else {
        document.getElementById('rider-login-screen').style.display = 'flex';
      }
    });

    async function riderLogin() {
      const selectedType = document.getElementById('login-rider-type').value;
      const phone = document.getElementById('login-phone').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      if (!phone) return alert('Kripya apna mobile number bharein!');

      const { data, error } = await _supabase.from('riders').select('*').eq('phone', phone).single();
      if (error || !data) {
        return alert('Rider record nahi mila! Kripya Admin se register karwayein.');
      }

      if (data.password && data.password !== pass) {
        return alert('Galat Password! Kripya sahi password darj karein.');
      }

      // Check or update role
      if (data.rider_type !== selectedType) {
        await _supabase.from('riders').update({ rider_type: selectedType }).eq('id', data.id);
        data.rider_type = selectedType;
      }

      currentRider = data;
      localStorage.setItem('sm_rider_data', JSON.stringify(data));
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('rider-login-screen').style.display = 'none';
      document.getElementById('nav-rider-name').innerText = currentRider.name;
      document.getElementById('nav-rider-phone').innerText = `📞 ${currentRider.phone} (${currentRider.vehicle_no || 'NA'})`;
      
      const isSuper = currentRider.rider_type === 'SUPER';
      document.getElementById('profile-role-badge').innerText = isSuper ? '👑 Dedicated Super Rider (24 Hours)' : '⚡ Normal Express Rider (10-20 Min)';
      
      updateDutyUI(currentRider.is_active);
      startLiveGpsTracking();
      fetchRiderOrders();
      setupRiderRealtime();
    }

    function riderLogout() {
      if (!confirm('Logout karna chahte hain?')) return;
      if (liveGpsWatchId) navigator.geolocation.clearWatch(liveGpsWatchId);
      localStorage.removeItem('sm_rider_data');
      location.reload();
    }

    async function toggleDuty() {
      const newStatus = !currentRider.is_active;
      await _supabase.from('riders').update({ is_active: newStatus }).eq('id', currentRider.id);
      currentRider.is_active = newStatus;
      localStorage.setItem('sm_rider_data', JSON.stringify(currentRider));
      updateDutyUI(newStatus);
    }

    function updateDutyUI(isActive) {
      const btn = document.getElementById('duty-btn');
      if (isActive) {
        btn.className = 'duty-toggle-btn';
        btn.innerText = '🟢 ONLINE';
      } else {
        btn.className = 'duty-toggle-btn offline';
        btn.innerText = '🔴 OFFLINE';
      }
    }

    function startLiveGpsTracking() {
      if (!navigator.geolocation) return;
      liveGpsWatchId = navigator.geolocation.watchPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        await _supabase.from('riders').update({ current_lat: lat, current_lng: lng }).eq('id', currentRider.id);
      }, (err) => console.warn('GPS error:', err.message), {
        enableHighAccuracy: true,
        maximumAge: 5000
      });
    }

    async function fetchRiderOrders() {
      if (!currentRider) return;
      const { data } = await _supabase.from('orders').select('*').order('id', { ascending: false });
      
      const isSuper = currentRider.rider_type === 'SUPER';
      
      allRiderOrders = (data || []).filter(o => {
        if (o.assigned_rider_id === currentRider.id) return true;
        if (!o.assigned_rider_id) {
          if (isSuper) return o.delivery_type === '24_HOURS';
          return o.delivery_type !== '24_HOURS';
        }
        return false;
      });

      renderRiderOrders();
    }

    function renderRiderOrders() {
      const activeBox = document.getElementById('rider-orders-list');
      const historyBox = document.getElementById('rider-history-list');

      const active = allRiderOrders.filter(o => !o.status.toLowerCase().includes('delivered') && !o.status.toLowerCase().includes('cancelled'));
      const past = allRiderOrders.filter(o => o.status.toLowerCase().includes('delivered') || o.status.toLowerCase().includes('cancelled'));

      document.getElementById('stat-active-count').innerText = active.length;
      document.getElementById('stat-delivered-count').innerText = past.length;
      document.getElementById('stat-earnings').innerText = `₹${past.length * 35}`;

      if (active.length === 0) {
        activeBox.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">🎉 Abhi koi active order pending nahi hai.</div>';
      } else {
        activeBox.innerHTML = active.map(o => {
          const isSuper = o.delivery_type === '24_HOURS';
          const isAssignedToMe = o.assigned_rider_id === currentRider.id;
          const isOut = o.status.toLowerCase().includes('out') || o.status.toLowerCase().includes('running');
          const isArrived = (o.status || '').toLowerCase() === 'arrived';

          let items = [];
          try { items = Array.isArray(o.items) ? o.items : JSON.parse(o.items || '[]'); } catch(e){}
          const itemsText = items.map(i => `• ${i.name} × ${i.qty}`).join('<br>');

          return `
            <div class="order-card ${isSuper ? 'super-order' : ''}">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <b style="font-size:15px; color:var(--accent-cyan);">#ORD-${o.id}</b>
                  <span class="order-badge ${isSuper ? 'badge-24hr' : 'badge-express'}" style="margin-left:6px;">
                    ${isSuper ? '⏳ 24 HR' : '⚡ 14 MIN'}
                  </span>
                </div>
                <div style="text-align:right;">
                  <b style="font-size:15px; color:#10b981;">₹${o.total_amount}</b>
                  <div style="font-size:11px; color:var(--text-muted);">${o.payment_mode}</div>
                </div>
              </div>

              <div class="detail-box">
                <div>👤 <b>Customer:</b> ${o.customer_name} (📞 <a href="tel:${o.customer_phone}" style="color:#38bdf8;">${o.customer_phone}</a>)</div>
                <div>📍 <b>Address:</b> ${o.delivery_address}</div>
                <div style="margin-top:4px; padding-top:4px; border-top:1px dashed var(--border-color);">
                  <b>Items:</b><br>${itemsText}
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:8px;">
                ${o.delivery_address && o.delivery_address.includes('GPS:') ? `
                  <a href="https://maps.google.com/?q=${extractGps(o.delivery_address)}" target="_blank" class="btn-rider-action btn-map">
                    🗺️ Open Map Navigation ↗
                  </a>
                ` : ''}

                ${!isAssignedToMe ? `
                  <button class="btn-rider-action btn-success" onclick="acceptOrder(${o.id})">
                    🤝 Order Accept Karein
                  </button>
                ` : !isOut ? `
                  <button class="btn-rider-action btn-success" onclick="startDelivery(${o.id})">
                    🛵 Saman Pick Kiya & Start Delivery
                  </button>
                ` : !isArrived ? `
                  <button class="btn-rider-action btn-map" style="background:#f59e0b; color:black;" onclick="markArrived(${o.id})">
                    🔔 Customer Ke Ghar Pahunch Gaya (Arrived Alert)
                  </button>
                ` : `
                  <button class="btn-rider-action btn-success" onclick="openCompleteModal(${o.id})">
                    🏁 Complete Delivery (OTP & Photo)
                  </button>
                `}
              </div>
            </div>
          `;
        }).join('');
      }

      if (past.length === 0) {
        historyBox.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Koi purana completed order nahi mila.</div>';
      } else {
        historyBox.innerHTML = past.map(o => `
          <div class="order-card" style="opacity:0.85;">
            <div style="display:flex; justify-content:space-between;">
              <b>#ORD-${o.id}</b>
              <span style="color:#10b981; font-weight:800;">${o.status}</span>
            </div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
              ₹${o.total_amount} | ${new Date(o.created_at).toLocaleDateString()}
            </div>
          </div>
        `).join('');
      }
    }

    function extractGps(addr) {
      const match = addr.match(/GPS:\s*([\d\.-]+),\s*([\d\.-]+)/);
      return match ? `${match[1]},${match[2]}` : '';
    }

    async function acceptOrder(id) {
      await _supabase.from('orders').update({ assigned_rider_id: currentRider.id }).eq('id', id);
      alert('Order accept ho gaya!');
      fetchRiderOrders();
    }

    async function startDelivery(id) {
      await _supabase.from('orders').update({ status: 'Out for Delivery' }).eq('id', id);
      fetchRiderOrders();
    }

    async function markArrived(id) {
      await _supabase.from('orders').update({ status: 'Arrived' }).eq('id', id);
      alert('🔔 Customer ko door-bell alert bhej diya gaya hai!');
      fetchRiderOrders();
    }

    function openCompleteModal(id) {
      activeCompleteOrderId = id;
      document.getElementById('complete-modal').classList.add('active');
    }

    function closeCompleteModal() {
      document.getElementById('complete-modal').classList.remove('active');
      base64DeliveryProof = null;
      document.getElementById('verify-otp-input').value = '';
      document.getElementById('proof-photo-preview').innerHTML = '<span style="font-size:11px; color:var(--text-muted);">📸 Delivery Proof Photo</span>';
    }

    function handleDeliveryPhotoCaptured(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = (e) => {
        base64DeliveryProof = e.target.result;
        document.getElementById('proof-photo-preview').innerHTML = `<img src="${base64DeliveryProof}" style="width:100%; height:100%; object-fit:cover;">`;
      };
      reader.readAsDataURL(file);
    }

    async function submitOrderDelivered() {
      const enteredOtp = document.getElementById('verify-otp-input').value.trim();
      if (!enteredOtp || enteredOtp.length !== 4) return alert('Kripya customer ka 4-digit secret OTP bharein!');
      if (!base64DeliveryProof) return alert('Delivery proof photo kheinchna anivarya hai!');

      const targetOrder = allRiderOrders.find(o => o.id === activeCompleteOrderId);
      if (!targetOrder) return;

      if (targetOrder.delivery_otp && targetOrder.delivery_otp !== enteredOtp) {
        return alert('❌ Galat OTP! Kripya customer se sahi OTP poochhein.');
      }

      await _supabase.from('orders').update({
        status: 'Delivered',
        delivery_proof_photo: base64DeliveryProof
      }).eq('id', activeCompleteOrderId);

      alert('🎉 Order Safaltapoorvak Deliver Ho Gaya!');
      closeCompleteModal();
      fetchRiderOrders();
    }

    function switchRiderTab(tab) {
      document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-btn-${tab}`).classList.add('active');
      document.getElementById('section-active-orders').style.display = tab === 'active' ? 'block' : 'none';
      document.getElementById('section-history-orders').style.display = tab === 'history' ? 'block' : 'none';
    }

    function setupRiderRealtime() {
      _supabase.channel('rider_sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => fetchRiderOrders())
        .subscribe();
    }
  </script>
</body>
</html>
