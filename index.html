<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BABA FOOD & GROCERY — Online Ordering</title>

  <link rel="icon" type="image/png" href="logo.png">
  <meta name="theme-color" content="#120224">

  <!-- FORCE BROWSER TO IGNORE CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary-purple: #3c006b;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 30px;
      min-height: 100vh;
    }

    /* TOP APP BAR */
    .app-header {
      background: #1e112a;
      padding: 14px 16px;
      border-bottom: 1px solid #381a4d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-box img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid #ff758c;
      background: #fff;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--accent-blue);
      font-weight: 700;
    }

    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* SECTION TITLE */
    .sec-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* TRACKING CARD */
    .track-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
      margin-bottom: 12px;
    }

    .order-id-txt {
      font-size: 15px;
      font-weight: 900;
      color: var(--accent-blue);
    }

    .order-price-txt {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-green);
    }

    /* STATUS BADGE */
    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-placed { background: #0284c7; color: #fff; }
    .status-transit { background: var(--accent-yellow); color: #000; }
    .status-delivered { background: var(--accent-green); color: #fff; }
    .status-cancelled { background: var(--accent-red); color: #fff; }

    /* RIDER ETA BANNER (NEW FEATURE) */
    .eta-box {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      margin: 12px 0;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.99); }
      100% { transform: scale(1.01); box-shadow: 0 6px 18px rgba(2, 132, 199, 0.6); }
    }

    .eta-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .eta-time {
      font-size: 20px;
      font-weight: 900;
      color: #fde047;
      margin-top: 2px;
    }

    /* OTP BOX */
    .otp-display-box {
      background: #0f172a;
      border: 1.5px dashed #38bdf8;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      margin-top: 10px;
    }

    .otp-val {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #38bdf8;
    }

    .cust-info-text {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 700;
    }

    .btn-refresh {
      background: var(--primary-purple);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="app-header">
    <div class="brand-box">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">BABA FOODS 🛍️</div>
        <div class="brand-sub">Express Delivery</div>
      </div>
    </div>
  </div>

  <div class="container">
    <button class="btn-refresh" onclick="fetchCustomerOrders()">🔄 Refresh Order Status</button>

    <div class="sec-title">📦 Your Active Orders & Live Tracking</div>
    <div id="customer-orders-list">
      <div class="empty-state">ऑर्डर्स लोड हो रहे हैं...</div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://mpeikimhkjuinqkjaumr.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_2_wD-pbi_pNf8niiHxFbYA_saCIhApN';

    function fetchCustomerOrders() {
      fetch(SUPABASE_URL + '/rest/v1/orders?select=*&order=id.desc&limit=5', {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      })
      .then(function(res) {
        if (!res.ok) throw new Error("Network error");
        return res.json();
      })
      .then(function(orders) {
        renderOrders(orders || []);
      })
      .catch(function(err) {
        console.warn("Fetch error:", err);
      });
    }

    function renderOrders(orders) {
      var container = document.getElementById('customer-orders-list');
      if (!container) return;

      if (orders.length === 0) {
        container.innerHTML = '<div class="empty-state">आपने अभी तक कोई ऑर्डर नहीं दिया है।</div>';
        return;
      }

      container.innerHTML = orders.map(function(order) {
        var isDispatched = order.status === 'Out for Delivery';
        var isDelivered = order.status === 'Delivered';
        var isCancelled = order.status === 'Cancelled';
        var isPlaced = !isDispatched && !isDelivered && !isCancelled;

        // RIDER TIMING / ETA HTML
        var etaBannerHtml = '';
        if (isDispatched) {
          var etaText = order.estimated_delivery_time || '15-20 mins';
          etaBannerHtml = 
            '<div class="eta-box">' +
              '<div class="eta-title">🛵 राइडर डिलीवरी के लिए निकल चुका है</div>' +
              '<div class="eta-time">⏱️ आपके पास पहुँचने का समय: ' + etaText + '</div>' +
            '</div>';
        } else if (isPlaced) {
          etaBannerHtml = 
            '<div style="background:#1e293b; border:1px solid #334155; color:#38bdf8; padding:10px; border-radius:12px; font-size:12px; font-weight:700; text-align:center; margin:10px 0;">' +
              '⏳ आपका ऑर्डर तैयार हो रहा है... राइडर जल्द पिकअप करेगा।' +
            '</div>';
        }

        // OTP HTML FOR DELIVERY VERIFICATION
        var otpHtml = '';
        if (!isDelivered && !isCancelled && order.delivery_otp) {
          otpHtml = 
            '<div class="otp-display-box">' +
              '<div style="font-size:11px; color:#94a3b8; font-weight:700;">DELIVERY OTP (राइडर को दें)</div>' +
              '<div class="otp-val">' + order.delivery_otp + '</div>' +
            '</div>';
        }

        var badgeClass = isDelivered ? 'status-delivered' : isCancelled ? 'status-cancelled' : isDispatched ? 'status-transit' : 'status-placed';

        return '<div class="track-card">' +
          '<div class="track-header">' +
            '<div>' +
              '<div class="order-id-txt">#ORD-' + order.id + '</div>' +
              '<span class="status-pill ' + badgeClass + '">' + (order.status || 'Order Placed') + '</span>' +
            '</div>' +
            '<div style="text-align:right;">' +
              '<div class="order-price-txt">₹' + (order.total_amount || 0) + '</div>' +
              '<div style="font-size:10.5px; color:#94a3b8; font-weight:700;">' + (order.payment_mode || 'COD') + '</div>' +
            '</div>' +
          '</div>' +

          /* LIVE RIDER TIMING DISPLAY */
          etaBannerHtml +

          '<div class="cust-info-text">' +
            '<div><b>📍 डिलीवरी का पता:</b> ' + (order.delivery_address || 'N/A') + '</div>' +
            '<div><b>👤 ग्राहक का नाम:</b> ' + (order.customer_name || 'Customer') + ' (' + (order.customer_phone || '') + ')</div>' +
          '</div>' +

          /* DELIVERY OTP DISPLAY */
          otpHtml +
        '</div>';
      }).join('');
    }

    // AUTO REFRESH EVERY 4 SECONDS FOR LIVE TRACKING
    window.addEventListener('DOMContentLoaded', function() {
      fetchCustomerOrders();
      setInterval(fetchCustomerOrders, 4000);
    });
  </script>
</body>
</html>
